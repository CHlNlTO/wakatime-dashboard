<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded tile -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#141414"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- 3x3 contribution cells spelling a "W": the W's vertices (top tips,
       bottom valleys, centre peak) carry the stronger greens, the strokes
       between them a softer one, and the centre is the brightest.
       Green, like GitHub's contribution graph. -->
  <g>
    <!-- left column: tip, stroke, valley -->
    <rect x="11" y="11" width="12" height="12" rx="3" fill="#2ea043" fill-opacity="0.7"/>
    <rect x="11" y="26" width="12" height="12" rx="3" fill="#2ea043" fill-opacity="0.45"/>
    <rect x="11" y="41" width="12" height="12" rx="3" fill="#2ea043" fill-opacity="0.7"/>
    <!-- middle column: empty, centre peak, empty -->
    <rect x="26" y="11" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="26" y="26" width="12" height="12" rx="3" fill="#3fb950"/>
    <rect x="26" y="41" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <!-- right column: tip, stroke, valley -->
    <rect x="41" y="11" width="12" height="12" rx="3" fill="#2ea043" fill-opacity="0.7"/>
    <rect x="41" y="26" width="12" height="12" rx="3" fill="#2ea043" fill-opacity="0.45"/>
    <rect x="41" y="41" width="12" height="12" rx="3" fill="#2ea043" fill-opacity="0.7"/>
  </g>
</svg>
